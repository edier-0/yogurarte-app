services:
  # ============================================================================
  # Base de Datos PostgreSQL (Servicio Local / Respaldo)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: yogurarte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-yogurarte_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yogurarte_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yogurarte_net

  # ============================================================================
  # Servidor de Aplicación YogurArte (Node.js + Prisma + Web UI)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yogurarte_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-yogurarte_db}?schema=public"
      JWT_SECRET: "${JWT_SECRET:-ba6822f65365a699a960575fe416b3a00770fd1659c34654d56e8c955ce6a78a}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1d}"
    env_file:
      - .env
    volumes:
      - ./public:/app/public
      - baileys_auth_data:/app/baileys_auth_info
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yogurarte_net

# ==============================================================================
# Volúmenes Persistentes
# ==============================================================================
volumes:
  postgres_data:
    name: yogurarte_postgres_data
    driver: local
  baileys_auth_data:
    name: yogurarte_baileys_auth_data
    driver: local
  app_logs:
    name: yogurarte_app_logs
    driver: local

# ==============================================================================
# Redes Aisladas
# ==============================================================================
networks:
  yogurarte_net:
    name: yogurarte_network
    driver: bridge
