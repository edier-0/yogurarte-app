<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A154B"/>
      <stop offset="100%" stop-color="#2D0B35"/>
    </linearGradient>
    <linearGradient id="iconMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="iconLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="5" y="5" width="110" height="110" rx="30" fill="url(#iconBg)" filter="url(#iconShadow)"/>
  
  <!-- Subtle Cream Milk Ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#FFF8F0" stroke-width="2" stroke-dasharray="6 3" opacity="0.4"/>

  <!-- Milk Bottle / Yogurt Bowl Graphic -->
  <g transform="translate(60, 52)">
    <!-- Natural Leaf on top right -->
    <g transform="translate(18, -26) scale(0.65) rotate(25)">
      <path d="M0,12 C-8,0 0,-14 14,-10 C18,4 8,14 0,12 Z" fill="url(#iconLeaf)"/>
      <path d="M10,-6 C3,0 2,6 -1,10" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Stylized Heart/Berry -->
    <path d="M0,8 C-7,0 -16,8 -10,18 C-4,28 0,33 0,33 C0,33 4,28 10,18 C16,8 7,0 0,8 Z" fill="url(#iconMagenta)" transform="scale(0.8) translate(0, -32)"/>
    
    <!-- Stylized 'YA' Monogram -->
    <text x="-4" y="24" font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', cursive, sans-serif" font-size="44" font-weight="bold" fill="#FFF8F0" text-anchor="middle">Y</text>
    <text x="18" y="26" font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', cursive, sans-serif" font-size="34" font-weight="bold" fill="url(#iconMagenta)" text-anchor="middle">A</text>
  </g>

  <!-- Bottom subtitle: FONSECA -->
  <text x="60" y="104" font-family="'Segoe UI', 'Montserrat', sans-serif" font-size="8.5" font-weight="800" fill="#FFF8F0" text-anchor="middle" letter-spacing="2" opacity="0.9">YOGURARTE</text>
</svg>
