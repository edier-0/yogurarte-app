<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YogurArte | Sistema de Gestión y Control</title>
  <meta name="description" content="Sistema integral para gestión de pedidos, producción, inventario y finanzas de YogurArte - Yogur Artesanal Natural en Fonseca.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
  
  <!-- Google Fonts: Plus Jakarta Sans + Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos del Sistema -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Barra Lateral de Navegación (Desktop) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/logo-icon.svg" alt="YogurArte Logo" class="sidebar-logo">
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-title">YogurArte</span>
          <span class="sidebar-brand-subtitle">Fonseca • Artesanal</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="dashboard">
          <span class="nav-icon">📊</span>
          <span>Panel Principal</span>
        </button>

        <button class="nav-item" data-tab="orders">
          <span class="nav-icon">🥛</span>
          <span>Pedidos y Ventas</span>
        </button>

        <button class="nav-item" data-tab="batches">
          <span class="nav-icon">🍶</span>
          <span>Producción (Lotes)</span>
        </button>

        <button class="nav-item" data-tab="inventory">
          <span class="nav-icon">📦</span>
          <span>Materia Prima</span>
        </button>

        <button class="nav-item" data-tab="expenses">
          <span class="nav-icon">🧾</span>
          <span>Gastos / Infraestructura</span>
        </button>

        <button class="nav-item" data-tab="staff">
          <span class="nav-icon">👥</span>
          <span>Nómina y Personal</span>
        </button>

        <button class="nav-item" data-tab="customers">
          <span class="nav-icon">🤝</span>
          <span>Clientes</span>
        </button>
      </nav>

      <!-- Selector de Usuario Activo (Desktop) -->
      <div class="sidebar-footer">
        <div class="user-selector-box">
          <div class="user-avatar" id="userAvatar">E</div>
          <div class="user-info">
            <span class="user-label">Conectado como</span>
            <span id="activeUserNameDisplay" style="font-size: 0.88rem; font-weight: 800; color: var(--primary);">Edier</span>
          </div>
          <button class="btn-logout" id="btnLogoutDesktop" title="Cerrar sesión">
            🚪
          </button>
        </div>
      </div>
    </aside>

    <!-- Contenido Principal -->
    <div class="main-wrapper">
      
      <!-- Encabezado Superior -->
      <header class="top-header">
        <div class="header-title-container">
          <h1 class="page-title" id="pageTitle">Panel de Control</h1>
        </div>

        <div class="header-actions">
          <!-- Insignia de Usuario para Móvil y Tablet con opción de salir -->
          <div class="header-user-badge" id="headerUserBadge">
            <div class="user-avatar" id="headerUserAvatar">E</div>
            <span id="headerUserNameDisplay" style="font-size: 0.85rem; font-weight: 800; color: var(--text-main);">Edier</span>
            <button class="btn-logout-mini" id="btnLogoutMobile" title="Cerrar sesión">
              🚪
            </button>
          </div>

          <button class="btn btn-accent" id="btnNewOrderGlobal">
            <span>+</span> Nuevo Pedido
          </button>
        </div>
      </header>

      <!-- Cuerpo Dinámico -->
      <main class="content-body" id="contentContainer">
        <!-- Vistas inyectadas dinámicamente por JavaScript -->
      </main>

    </div>

    <!-- Barra de Navegación Inferior (Móvil) -->
    <nav class="mobile-nav">
      <button class="mobile-nav-btn active" data-tab="dashboard">
        <span class="icon">📊</span>
        <span>Inicio</span>
      </button>

      <button class="mobile-nav-btn" data-tab="orders">
        <span class="icon">🥛</span>
        <span>Pedidos</span>
      </button>

      <button class="mobile-nav-btn" data-tab="batches">
        <span class="icon">🍶</span>
        <span>Lotes</span>
      </button>

      <button class="mobile-nav-btn" data-tab="inventory">
        <span class="icon">📦</span>
        <span>Insumos</span>
      </button>

      <button class="mobile-nav-btn" data-tab="expenses">
        <span class="icon">🧾</span>
        <span>Gastos</span>
      </button>

      <button class="mobile-nav-btn" data-tab="staff">
        <span class="icon">👥</span>
        <span>Nómina</span>
      </button>

      <button class="mobile-nav-btn" data-tab="customers">
        <span class="icon">🤝</span>
        <span>Clientes</span>
      </button>
    </nav>

    <!-- Botón Flotante para Móvil (FAB) -->
    <button class="mobile-fab" id="mobileFabOrder" title="Nuevo Pedido">
      +
    </button>

    <!-- Contenedor para Modales Dinámicos -->
    <div id="modalContainer"></div>

    <!-- Pantalla de Login / Bloqueo -->
    <div id="loginScreenContainer"></div>

    <!-- Contenedor de Notificaciones Toast -->
    <div class="toast-container" id="toastContainer"></div>

  </div>

  <!-- JavaScript Modular -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
